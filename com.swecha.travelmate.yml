Summary: Multimodal transit planner for Hyderabad
Description: |
  TravelMate is a free, open-source multimodal public transit planner for
  Hyderabad, India — built by Swecha as a civic technology project.

  Plan your daily commute across Hyderabad Metro, MMTS suburban rail, and
  TSRTC city buses — all in one app, with no internet required for routing.

  Features:
  * Multimodal routing: Metro, MMTS, and 1,000+ TSRTC bus routes
  * Live map with traffic, weather, and AQI overlays
  * Six smart commuter strategies
  * Full Telugu (తెలుగు) language support
  * Mobility analytics and GIS heatmap
  * Community RidePool with points system
  * Privacy-first: no account, no tracking, all routing on-device

