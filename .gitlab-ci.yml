stages:
  - build

build:
  stage: build
  image: eclipse-temurin:21-jdk
  retry: 2
  timeout: 30 minutes
  variables:
    ANDROID_SDK_ROOT: /opt/android-sdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip git
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y -qq nodejs
    - curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - unzip -q /tmp/cmdtools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
    - mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    # Pre-accept licenses by writing the hash files directly (avoids yes | sdkmanager SIGPIPE issue)
    - mkdir -p $ANDROID_SDK_ROOT/licenses
    - printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4408b01491c1813e7f8aab25b372" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
    - printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
    - printf "d975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_SDK_ROOT/licenses/intel-android-extra-license
    - sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-36" "build-tools;36.0.0" "platform-tools"
  script:
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    - cd frontend
    - npm install
    - npm run build
    - echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
    - rm -rf android/app/src/main/assets/public
    - cp -r dist android/app/src/main/assets/public
    - cd android
    - chmod +x gradlew
    - ./gradlew assembleDebug --no-daemon --stacktrace
  artifacts:
    name: "TravelMate-debug-$CI_COMMIT_SHORT_SHA"
    paths:
      - frontend/android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 90 days
